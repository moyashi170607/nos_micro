[package]
name = "pico2w"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-rp = { version = "0.10", features = [
    "rp235xa",
    "time-driver",
    "critical-section-impl",
    "executor-thread",
    "binary-info",
] }
embassy-executor = "0.10"
embassy-time = "0.5"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
static_cell = "2.1"

cyw43 = "0.7"
cyw43-pio = "0.10"

signer = { path = "../../nos_micro_core/signer", features = ["nostr"] }


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
