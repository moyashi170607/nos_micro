[package]
name = "signer"
version.workspace = true
edition.workspace = true

[dependencies]
nostr = { version = "0.45.7", default-features = false, features = [
    "alloc",
    "nip44",
] }
secp256k1 = { version = "0.30", default-features = false, features = [
    "alloc",
    "lowmemory",
] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
